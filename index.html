<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruian Client</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0c131b; color: #dde6ee; font: 14px system-ui, sans-serif; }
    #incari-canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #ruian-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px;
      background: radial-gradient(ellipse at 50% 35%, #223a4f 0%, #16283a 45%, #0c131b 100%); }
    #ruian-loader[hidden] { display: none; }
    #ruian-mark { display: block; width: min(300px, 58vw); height: auto; margin: 0 0 14px;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.45)); }
    #ruian-track { width: min(420px, 80vw); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
    #ruian-bar { position: relative; width: 0; min-width: 4px; height: 100%; border-radius: 2px; background: #a9dcff;
      box-shadow: 0 0 8px rgba(169, 220, 255, 0.6); transition: width 120ms linear; }
    #ruian-bar::after { content: ""; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; border-radius: 50%;
      background: radial-gradient(#fff 0 30%, rgba(169, 220, 255, 0.9) 45%, rgba(169, 220, 255, 0) 70%); }
    #ruian-bar.indeterminate { animation: ruian-pulse 1.2s ease-in-out infinite; }
    #ruian-loader.failed #ruian-bar { background: #e5534b; box-shadow: none; animation: none; }
    #ruian-loader.failed #ruian-bar::after { display: none; }
    #ruian-status { font-size: 15px; color: #fff; text-shadow: 0 1px 6px rgba(12, 19, 27, 0.6); }
    #ruian-detail { min-height: 1.4em; max-width: min(560px, 90vw); text-align: center; opacity: 0.8;
      text-shadow: 0 1px 6px rgba(12, 19, 27, 0.6); }
    #ruian-track[hidden], #ruian-choose[hidden], .ruian-pick[hidden] { display: none; }
    #ruian-choose { display: flex; flex-direction: column; gap: 10px; width: min(480px, calc(100vw - 32px)); }
    .ruian-pick { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; text-align: left;
      font: inherit; color: #dde6ee; background: rgba(16, 24, 34, 0.72); border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px; cursor: pointer; }
    .ruian-pick:hover:not(:disabled), .ruian-pick:focus-visible { border-color: #a9dcff; outline: none; }
    .ruian-pick:disabled { cursor: not-allowed; opacity: 0.55; }
    #ruian-pick-fast { background: rgba(24, 40, 58, 0.78); border-color: rgba(169, 220, 255, 0.45); }
    .ruian-pick-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #fff; }
    .ruian-badge { padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600;
      color: #0b1a2a; background: #a9dcff; }
    .ruian-badge.quiet { color: #dde6ee; background: rgba(255, 255, 255, 0.14); }
    .ruian-pick-text { font-size: 13px; opacity: 0.8; }
    .ruian-pick-why { font-size: 13px; color: #e5a04b; }
    .ruian-pick-why:empty { display: none; }
    .ruian-pick-hint { margin: 2px 0 0; font-size: 13px; opacity: 0.8; text-align: center;
      text-shadow: 0 1px 6px rgba(12, 19, 27, 0.6); }
    @keyframes ruian-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="incari-canvas"></canvas>
  <div id="ruian-loader" role="status" aria-live="polite">
    <img id="ruian-mark" src="ruian-logo.svg" alt="Ruian Client">
    <div id="ruian-track"><div id="ruian-bar"></div></div>
    <div id="ruian-status">Loading</div>
    <div id="ruian-detail"></div>
    <div id="ruian-choose" role="group" aria-labelledby="ruian-status" hidden>
      <button id="ruian-pick-fast" class="ruian-pick" type="button" aria-describedby="ruian-why-fast">
        <span class="ruian-pick-title">Fast <span class="ruian-badge">Recommended</span></span>
        <span class="ruian-pick-text">Higher frame rates, a smaller download and faster loading. Needs a recent browser.</span>
        <span class="ruian-pick-why" id="ruian-why-fast"></span>
      </button>
      <button id="ruian-pick-compatible" class="ruian-pick" type="button" aria-describedby="ruian-why-compatible">
        <span class="ruian-pick-title">Compatible <span class="ruian-badge quiet">For older browsers</span></span>
        <span class="ruian-pick-text">Works in Safari and older versions of Chrome and Firefox, but runs slower.</span>
        <span class="ruian-pick-why" id="ruian-why-compatible"></span>
      </button>
      <button id="ruian-pick-rust" class="ruian-pick" type="button" aria-describedby="ruian-why-rust" hidden>
        <span class="ruian-pick-title">Rust <span class="ruian-badge quiet">Experimental</span></span>
        <span class="ruian-pick-text">The game rewritten in Rust, drawn with WebGPU. Few Ruian modules yet, and some things may not work.</span>
        <span class="ruian-pick-why" id="ruian-why-rust"></span>
      </button>
      <p class="ruian-pick-hint">Choose Compatible only if Fast won't start in your browser.</p>
    </div>
  </div>
  <noscript>The game needs JavaScript.</noscript>
  <script src="ruian-patch.js"></script>
  <script type="module" src="boot.js"></script>
</body>
</html>
