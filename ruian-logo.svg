  <text x="200" y="85" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="62" font-weight="900" fill="url(#gold)" stroke="#8b4513" stroke-width="2" filter="url(#shadow)">Ruian</text>
  <text x="200" y="160" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="62" font-weight="900" fill="url(#gold)" stroke="#8b4513" stroke-width="2" filter="url(#shadow)">Client</text>
